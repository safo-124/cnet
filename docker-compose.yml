# Public demo deployment.
#
#   With the bundled Caddy (gets an HTTPS certificate automatically):
#     docker compose --profile proxy up -d --build
#
#   Behind a reverse proxy you already run (nginx, Traefik...): leave the profile out and
#   point the proxy at http://127.0.0.1:8080.
#
# Settings come from a .env file next to this one (see deploy/.env.example).

services:
  app:
    build: .
    image: mepcatalog
    restart: unless-stopped
    ports:
      # Only reachable from the server itself, never directly from the internet.
      # APP_PORT can be changed in .env if 8080 is already used by something else.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - catalog-data:/data
    environment:
      Demo__Enabled: "true"

  caddy:
    image: caddy:2
    profiles: [proxy]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Required with --profile proxy (set it in .env). Compose reads the whole file even when this
      # service isn't started, so a missing value must not be an error for the app-only setup.
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  catalog-data:
  caddy-data:
  caddy-config:
